  <title>AI駆動開発 12のデモンストレーション</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            navy: {
              50: '#fef2f2',
              100: '#fde3e3',
              200: '#f9b4b4',
              300: '#f28080',
              400: '#e84d4d',
              500: '#cc2222',
              600: '#b91c1c',
              700: '#991515',
              800: '#7a1010',
              900: '#5c0c0c',
            },
            warm: {
              50: '#f9fafb',
              100: '#f3f4f6',
              200: '#e5e7eb',
              300: '#d1d5db',
              400: '#9ca3af',
              500: '#6b7280',

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700&display=swap');
    * { font-family: 'Noto Sans JP', sans-serif; }

    /* アニメーションカウンター */
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(24px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .fade-in-up {
      opacity: 0;
      animation: fadeInUp 0.5s ease-out forwards;
    }

    /* カードホバー */
    .card-hover {
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }
    .card-hover:hover {
      transform: translateY(-4px);
      box-shadow: 0 12px 24px rgba(30, 58, 95, 0.12);
    }

    /* モーダル */
    .modal-overlay {
      transition: opacity 0.25s ease;
    }
    .modal-content {
      transition: transform 0.25s ease, opacity 0.25s ease;
    }
    .modal-overlay.hidden {
      opacity: 0;
      pointer-events: none;
    }
    .modal-overlay.hidden .modal-content {
      transform: scale(0.95);
      opacity: 0;
    }

    /* スクロールバー */
    .modal-scroll::-webkit-scrollbar { width: 6px; }
    .modal-scroll::-webkit-scrollbar-track { background: #f3f4f6; }
    .modal-scroll::-webkit-scrollbar-thumb { background: #9ca3af; border-radius: 3px; }

    /* カウンターアニメーション用 */
    .counter-value {
      transition: color 0.3s ease;
    }
  </style>
</head>

        <ul class="space-y-1.5">
          ${theme.after.items.map(item => `
            <li class="flex items-start gap-2 text-navy-600">
              <span class="mt-1.5 w-1.5 h-1.5 rounded-full bg-navy-400 flex-shrink-0"></span>
              ${item}
            </li>
          `).join('')}
        </ul>
      `;

      document.getElementById('modal-metrics').innerHTML = theme.metrics.map(m => `
        <div class="bg-warm-50 rounded-lg p-4 text-center">
          <div class="text-xs text-warm-400 mb-2">${m.label}</div>
          <div class="text-xs text-warm-500 line-through mb-1">${m.before}</div>
          <div class="text-lg font-bold text-navy-600">${m.after}</div>
          <div class="text-xs text-navy-400 mt-1">${m.improvement}</div>
        </div>
      `).join('');

      const typeLabels = { skill: 'Skill', hook: 'Hook', mcp: 'MCP', workflow: 'Workflow', tool: 'Tool' };
      const typeColors = {
        skill: 'bg-navy-50 text-navy-700 border-navy-200',
        hook: 'bg-amber-50 text-amber-700 border-amber-200',
        mcp: 'bg-emerald-50 text-emerald-700 border-emerald-200',
        workflow: 'bg-violet-50 text-violet-700 border-violet-200',
        tool: 'bg-slate-50 text-slate-700 border-slate-200'
      };
      document.getElementById('modal-skills').innerHTML = theme.skills ? `
        <div class="border border-warm-200 rounded-lg overflow-hidden">
          <div class="bg-warm-50 px-4 py-2 flex items-center gap-2">
            <svg class="w-4 h-4 text-navy-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19.428 15.428a2 2 0 00-1.022-.547l-2.387-.477a6 6 0 00-3.86.517l-.318.158a6 6 0 01-3.86.517L6.05 15.21a2 2 0 00-1.806.547M8 4h8l-1 1v5.172a2 2 0 00.586 1.414l5 5c1.26 1.26.367 3.414-1.415 3.414H4.828c-1.782 0-2.674-2.154-1.414-3.414l5-5A2 2 0 009 10.172V5L8 4z"/></svg>
            <span class="text-xs font-semibold text-warm-600 uppercase tracking-wide">Recommended Skills</span>
          </div>
          <div class="divide-y divide-warm-100">
            ${theme.skills.map(s => `
              <div class="px-4 py-3 flex items-start gap-3">
                <span class="inline-block px-2 py-0.5 text-[10px] font-semibold rounded border ${typeColors[s.type] || typeColors.skill} mt-0.5 flex-shrink-0">${typeLabels[s.type] || s.type}</span>
                <div class="min-w-0">
                  <div class="text-sm font-semibold text-navy-700">${s.name}</div>
                  <div class="text-xs text-warm-500 mt-0.5">${s.desc}</div>
                </div>
              </div>
            `).join('')}
          </div>
        </div>
      ` : '';

      document.getElementById('modal-link').href = `./${theme.folder}/`;

      modal.classList.remove('hidden');
      document.body.style.overflow = 'hidden';
    }

    function closeModal() {
      modal.classList.add('hidden');
      document.body.style.overflow = '';
    }

    modal.addEventListener('click', (e) => {
      if (e.target === modal) closeModal();
    });

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closeModal();
    });

    // --- カウンターアニメーション ---
    function animateCounters() {
      const counters = document.querySelectorAll('.counter-value');
      counters.forEach(counter => {
        const target = parseInt(counter.dataset.target);
        const suffix = counter.dataset.suffix || '';
        const isSpecial = counter.dataset.special === 'free';

        if (isSpecial) {
          counter.textContent = `0${suffix}`;
          return;
        }

        let current = 0;
        const duration = 1500;
        const steps = 40;
        const increment = target / steps;
        const stepTime = duration / steps;

        const timer = setInterval(() => {
          current += increment;
          if (current >= target) {
            current = target;
            clearInterval(timer);
          }
          counter.textContent = `${Math.round(current)}${suffix}`;
        }, stepTime);
      });
    }

    // Intersection Observer でヒーローが画面内に入ったらカウンター開始
    const heroObserver = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          animateCounters();
          heroObserver.disconnect();
        }
      });
    }, { threshold: 0.3 });

    const heroCounters = document.querySelector('header');
    if (heroCounters) heroObserver.observe(heroCounters);
  </script>

</body>
</html>
